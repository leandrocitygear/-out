<VirtualHost *:80>

    ServerName localhost

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory /var/www/html/api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # NEVER rewrite API requests
    RewriteRule ^/api/ - [END]

    # NEVER rewrite static assets
    RewriteRule ^/assets/ - [END]

    # NEVER rewrite favicon
    RewriteRule ^/favicon\.ico$ - [END]

    # If an actual file exists, serve it normally
    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [END]

    # If an actual directory exists, serve it normally
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [END]

    # Everything else goes to Vue
    RewriteRule ^ /index.html [END]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>