services:
  server:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "9000:80"
    restart: unless-stopped

    develop:
      watch:
        # Vue / TypeScript / CSS changes
        - action: rebuild
          path: ./src

        # PHP API changes
        - action: rebuild
          path: ./backend/api

        # Public assets
        - action: rebuild
          path: ./public

        # Apache configuration
        - action: rebuild
          path: ./backend/apache.conf

        # Dependencies changed
        - action: rebuild
          path: ./package.json

        - action: rebuild
          path: ./package-lock.json